name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android project structure
        run: flutter create . --project-name rockarea --org com.rockarea --platforms android

      - name: Configure Android Permissions and Desktop Icon
        run: |
          # 1. Повышаем compileSdk
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true

          # 2. Имя приложения с большой буквы
          sed -i 's/android:label="rockarea"/android:label="RockArea"/g' android/app/src/main/AndroidManifest.xml

          # 3. Разрешения на сохранение файлов в память
          sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml

          # 4. Удаляем старые картинки робота
          find android/app/src/main/res/ -name "ic_launcher*.png" -delete

          # 5. Цвет фона (#0F172A)
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F172A</color>
          </resources>
          EOF

          # 6. Векторный передний план
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:strokeColor="#334155"
                  android:strokeWidth="0.4"
                  android:strokeAlpha="0.4"
                  android:pathData="M24,40 L84,40 M24,54 L84,54 M24,68 L84,68 M38,24 L38,84 M54,24 L54,84 M70,24 L70,84" />
              <path
                  android:fillColor="#2563EB"
                  android:pathData="M54,25 L32,38 L40,56 L54,48 Z" />
              <path
                  android:fillColor="#60A5FA"
                  android:pathData="M54,25 L76,38 L68,56 L54,48 Z" />
              <path
                  android:fillColor="#1D4ED8"
                  android:pathData="M32,38 L40,56 L54,73 L42,68 Z" />
              <path
                  android:fillColor="#F97316"
                  android:pathData="M40,56 L68,56 L54,73 Z" />
              <path
                  android:fillColor="#3B82F6"
                  android:pathData="M76,38 L68,56 L54,73 L66,68 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,23 A2,2 0 1,0 54,27 A2,2 0 1,0 54,23" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M32,36 A2,2 0 1,0 32,40 A2,2 0 1,0 32,36" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M76,36 A2,2 0 1,0 76,40 A2,2 0 1,0 76,36" />
              <path
                  android:fillColor="#F97316"
                  android:pathData="M40,54 A2,2 0 1,0 40,58 A2,2 0 1,0 40,54" />
              <path
                  android:fillColor="#F97316"
                  android:pathData="M68,54 A2,2 0 1,0 68,58 A2,2 0 1,0 68,54" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,71 A2.2,2.2 0 1,0 54,75.4 A2.2,2.2 0 1,0 54,71" />
          </vector>
          EOF

          # 7. Адаптивная иконка
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Debug with Fixed Key)
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
