name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android platform files..."
            cp -r lib /tmp/lib_backup
            flutter create . --project-name=rockarea --platforms=android --org=com.div1kik.rockarea --overwrite
            rm -rf lib
            cp -r /tmp/lib_backup lib

            # Фиксируем minSdkVersion 21
            find android -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +
            find android -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +

            # Добавляем права камеры в AndroidManifest
            MANIFEST="android/app/src/main/AndroidManifest.xml"
            if [ -f "$MANIFEST" ]; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-feature android:name="android.hardware.camera"\/>\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"\/>' "$MANIFEST"
            fi
          fi

      - name: Clean and Resolve Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockArea-v2-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
